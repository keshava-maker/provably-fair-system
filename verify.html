
<!DOCTYPE html>
<html>
<head>
  <title>Provably Fair - Verify Round</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000000;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #111111;
      padding: 20px;
      border-radius: 10px;
      width: 420px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border-radius: 5px;
      border: none;
    }

    button {
      background: #22c55e;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .result {
      margin-top: 10px;
      font-size: 14px;
      word-wrap: break-word;
    }

    .match {
      color: #22c55e;
      font-weight: bold;
    }

    .mismatch {
      color: #ef4444;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Verify Fairness</h2>

  <input id="serverSeed" placeholder="Server Seed">
  <input id="client1" placeholder="Client Seed 1">
  <input id="client2" placeholder="Client Seed 2">
  <input id="client3" placeholder="Client Seed 3">
  <input id="claimed" placeholder="Claimed Multiplier (e.g. 2.17)">

  <button onclick="verify()">Verify Round</button>

  <div class="result">
    <p><b>Recalculated Multiplier:</b> <span id="recalc"></span></p>
    <p><b>Status:</b> <span id="status"></span></p>
  </div>
</div>

<script>
async function verify() {
  const server = document.getElementById("serverSeed").value;
  const c1 = document.getElementById("client1").value;
  const c2 = document.getElementById("client2").value;
  const c3 = document.getElementById("client3").value;
  const claimed = parseFloat(document.getElementById("claimed").value);

  const combined = server + c1 + c2 + c3;

  // Convert to bytes
  const encoder = new TextEncoder();
  const data = encoder.encode(combined);

  // SHA-512 hash
  const hashBuffer = await crypto.subtle.digest("SHA-512", data);

  // Buffer → HEX
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

  // First 13 hex chars
  const hexSlice = hashHex.slice(0, 13);

  // HEX → Decimal
  const decimal = parseInt(hexSlice, 16);

  // Calculate multiplier
  const multiplier = Math.round(((2 ** 52) / (decimal + 1)) * 100) / 100;

  document.getElementById("recalc").innerText = multiplier + "x";

  const status = document.getElementById("status");

  if (Math.abs(multiplier - claimed) < 0.01) {
    status.innerText = "MATCH ✅";
    status.className = "match";
  } else {
    status.innerText = "MISMATCH ❌";
    status.className = "mismatch";
  }
}
</script>

</body>
</html>
